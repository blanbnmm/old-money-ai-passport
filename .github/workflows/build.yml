name: Build Lao Qian AI firmware

on:
  push:
    branches: [main, feature/chinese-ui-redesign]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout this repo (with patches)
        uses: actions/checkout@v4
        with:
          path: src

      - name: Clone official AI Passport SDK into src/sdk
        run: |
          cd src
          git clone --depth 1 --recursive --shallow-submodules https://github.com/FoloToy/ai-passport.git sdk

      - name: Apply Lao Qian AI patches
        run: |
          if [ -d src/patches/main ]; then
            cp src/patches/main/menu.h src/sdk/main/menu.h
            cp src/patches/main/menu.c src/sdk/main/menu.c
            cp src/patches/main/feature_quote.h src/sdk/main/feature_quote.h
            cp src/patches/main/feature_quote.c src/sdk/main/feature_quote.c
            cp src/patches/main/feature_diary.h src/sdk/main/feature_diary.h
            cp src/patches/main/feature_diary.c src/sdk/main/feature_diary.c
            cp src/patches/main/feature_greeting.h src/sdk/main/feature_greeting.h
            cp src/patches/main/feature_greeting.c src/sdk/main/feature_greeting.c
            cp src/patches/main/old_money_quotes.h src/sdk/main/old_money_quotes.h
            cp src/patches/main/old_money_quotes.c src/sdk/main/old_money_quotes.c
            cp src/patches/main/old_money_diary.h src/sdk/main/old_money_diary.h
            cp src/patches/main/old_money_diary.c src/sdk/main/old_money_diary.c
            cp src/patches/main/stock_monitor.h src/sdk/main/stock_monitor.h
            cp src/patches/main/stock_monitor.c src/sdk/main/stock_monitor.c
            cp src/patches/main/CMakeLists.txt src/sdk/main/CMakeLists.txt
            cp src/patches/main/main.c src/sdk/main/main.c
            cp src/patches/main/demo.h src/sdk/main/demo.h
            cp src/patches/main/laoqian_fonts.h src/sdk/main/laoqian_fonts.h
            mkdir -p src/sdk/assets/fonts
            cp src/patches/assets/fonts/laoqian_font_16.c src/sdk/assets/fonts/laoqian_font_16.c
            cp src/patches/assets/fonts/laoqian_font_20.c src/sdk/assets/fonts/laoqian_font_20.c
            echo "✓ 老钱 AI 14 源码 + 2 中文字体已应用"
          else
            echo "❌ src/patches/main 不存在"
            exit 1
          fi

      - name: Install ESP-IDF v5.5.3 (with submodules)
        run: |
          cd ${{ runner.temp }}
          git clone --depth 1 -b v5.5.3 https://github.com/espressif/esp-idf.git
          cd esp-idf
          git submodule update --init --depth 1 --recursive
          ./install.sh esp32c3
          echo "IDF_PATH=${{ runner.temp }}/esp-idf" >> $GITHUB_ENV

      - name: Build firmware
        run: |
          source $IDF_PATH/export.sh
          cd src/sdk
          idf.py set-target esp32c3
          idf.py build
          echo "=== Build artifacts ==="
          find build -name "*.bin" 2>&1 | head -10

      - name: Install esptool
        run: |
          python3 -m pip install --quiet esptool

      - name: Merge bins manually
        run: |
          cd src/sdk/build
          BOOT=$(find . -name 'bootloader.bin' | head -1)
          PART=$(find . -name 'partition-table.bin' | head -1)
          APP=$(find . -name '*.bin' ! -name 'bootloader.bin' ! -name 'partition-table.bin' | head -1)
          echo "bootloader=$BOOT"
          echo "partition=$PART"
          echo "app=$APP"
          if [ -z "$APP" ]; then
            echo "❌ 找不到 app binary"
            ls -lh
            exit 1
          fi
          python3 -m esptool --chip esp32c3 merge_bin \
            --output FoloToy-AI-Passport-full.bin \
            --flash_mode dio --flash_size 4MB --flash_freq 80m \
            0x0 "$BOOT" \
            0x8000 "$PART" \
            0x10000 "$APP"
          ls -lh FoloToy-AI-Passport-full.bin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoloToy-AI-Passport-full
          path: src/sdk/build/FoloToy-AI-Passport-full.bin
          retention-days: 7